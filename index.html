<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test Keyboard & Speaker Online</title>
  <link rel="stylesheet" href="./style.css">

  <link rel="icon" href="./assets/kb.svg">


  <!-- Standard Meta Tags for SEO -->
<title>Online Keyboard & Speaker Test</title>
<meta name="description" content="Test your laptop or desktop's keyboard and speakers instantly online." />


<!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://your-domain.vercel.app/" />
<meta property="og:title" content="Online Keyboard & Speaker Test" />
<meta property="og:description" content="Test your laptop or desktop's keyboard and speakers easily online." />
<meta property="og:image" content="https://your-domain.vercel.app/og-preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter Card Tags -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="https://your-domain.vercel.app/" />
<meta name="twitter:title" content="Online Keyboard & Speaker Test" />
<meta name="twitter:description" content="Test your laptop or desktop's keyboard and speakers. Designed by Indrajit Kar." />
<meta name="twitter:image" content="https://your-domain.vercel.app/og-preview.png" />

<!-- Font Preconnections -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
  <main>
    <h1 class="main-heading">Online Keyboard Testing</h1>
    <button title="On or OFF sound effect on key press" class="on-off">Sound ON</button>
    <div class="keyboard-layout">
      <div class="kbl-1st">
        <button class="alpha" id="Backquote">`</button>
        <button class="alpha" id="Digit1">1</button>
        <button class="alpha" id="Digit2">2</button>
        <button class="alpha" id="Digit3">3</button>
        <button class="alpha" id="Digit4">4</button>
        <button class="alpha" id="Digit5">5</button>
        <button class="alpha" id="Digit6">6</button>
        <button class="alpha" id="Digit7">7</button>
        <button class="alpha" id="Digit8">8</button>
        <button class="alpha" id="Digit9">9</button>
        <button class="alpha" id="Digit0">0</button>
        <button class="alpha" id="Minus">-</button>
        <button class="alpha" id="Equal">=</button>
        <button class="alpha" id="Backspace">Bck Space</button>
      </div>
      <div class="kbl-2nd">
        <button class="alpha" id="Tab">Tab</button>
        <button class="alpha" id="KeyQ">Q</button>
        <button class="alpha" id="KeyW">W</button>
        <button class="alpha" id="KeyE">E</button>
        <button class="alpha" id="KeyR">R</button>
        <button class="alpha" id="KeyT">T</button>
        <button class="alpha" id="KeyY">Y</button>
        <button class="alpha" id="KeyU">U</button>
        <button class="alpha" id="KeyI">I</button>
        <button class="alpha" id="KeyO">O</button>
        <button class="alpha" id="KeyP">P</button>
        <button class="alpha" id="BracketLeft">[</button>
        <button class="alpha" id="BracketRight">]</button>
        <button class="alpha" id="Backslash">\</button>
      </div>

       <div class="kbl-3rd">
        <button class="alpha" id="CapsLock">Caps</button>
        <button class="alpha" id="KeyA">A</button>
        <button class="alpha" id="KeyS">S</button>
        <button class="alpha" id="KeyD">D</button>
        <button class="alpha" id="KeyF">F</button>
        <button class="alpha" id="KeyG">G</button>
        <button class="alpha" id="KeyH">H</button>
        <button class="alpha" id="KeyJ">J</button>
        <button class="alpha" id="KeyK">K</button>
        <button class="alpha" id="KeyL">L</button>
        <button class="alpha" id="Semicolon">;</button>
        <button class="alpha" id="Quote">'</button>
        <button class="alpha" id="Enter">Enter</button>
      </div>

      <div class="kbl-4th">
        <button class="alpha" id="ShiftLeft">Shift</button>
        <button class="alpha" id="KeyZ">Z</button>
        <button class="alpha" id="KeyX">X</button>
        <button class="alpha" id="KeyC">C</button>
        <button class="alpha" id="KeyV">V</button>
        <button class="alpha" id="KeyB">B</button>
        <button class="alpha" id="KeyN">N</button>
        <button class="alpha" id="KeyM">M</button>
        <button class="alpha" id="Comma">,</button>
        <button class="alpha" id="Period">.</button>
        <button class="alpha" id="Slash">/</button>
        <button class="alpha" id="ShiftRight">Shift</button>
        <!-- <button class="alpha" id="ArrowUp">↑</button> -->
      </div>

      <div class="kbl-5th">
        <button class="alpha" id="ControlLeft">Crtl</button>
        <button class="alpha" id="Metaleft">Win</button>
        <button class="alpha" id="AltLeft">Alt</button>
        <button class="alpha" id="Space">Space</button>
        <button class="alpha" id="AltRight">Alt</button>
        <button class="alpha" id="ControlRight">Crtl</button>
      </div>
    </div>
    <h3 class="speaker-heading">Test Your Speaker</h3>
    <div class="speaker-test">
      <button class="left-speaker">L Speaker</button>
      <button class="right-speaker">R Speaker</button>
    </div>

    <p>© Indrajit Kar 2026 indrajit.thunder@gmail.com</p>
    
  </main>
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="./indexKB3.js"></script>
  
</body>
</html>
